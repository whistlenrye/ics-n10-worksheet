[project]
name = "ics-n10-worksheet"
version = "0.1.0"
description = "Turn trade-document extractions into an Australian Import Declaration (N10) review worksheet."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Whistle and Rise" }]

[project.scripts]
ics-n10-worksheet = "ics_n10_worksheet.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
